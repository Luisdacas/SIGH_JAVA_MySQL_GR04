<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">

<f:metadata>
    <f:viewAction action="#{loginController.verificarSesion}" />
</f:metadata>

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inicio - SIGH</title>
    <link rel="icon" type="image/svg+xml" href="#{resource['img:favicon.svg']}" />
    <h:outputStylesheet library="css" name="styles.css" />
</h:head>

<h:body>

    <div class="encabezado">
        <div class="marca">
            <ui:include src="/WEB-INF/includes/logo.xhtml" />
            <div class="marca-texto">
                <span class="marca-nombre">SIGH</span>
                <span class="marca-sub">Sistema Integral de Gestión Hospitalaria</span>
            </div>
        </div>
    </div>

    <div class="franja">
        <span>Panel principal</span>
        <h:form>
            <h:commandButton value="Departamentos"
                             styleClass="boton boton-franja"
                             action="departamentos" />
        </h:form>
        <h:form>
            <h:commandButton value="Cargos"
                             styleClass="boton boton-franja"
                             action="cargos" />
        </h:form>
        <h:form>
             
            <h:commandButton value="Cerrar sesión"
                             styleClass="boton boton-franja"
                             action="#{loginController.cerrarSesion}" />
            
        </h:form>
    </div>

    <div class="contenido">
        <div class="tarjeta tarjeta-ancha tarjeta-mascota">
            <div class="mascota-flotante"><ui:include src="/WEB-INF/includes/mascota.xhtml" /></div>

            <h1>Bienvenido al Sistema Hospitalario SIGH</h1>

            <h:panelGroup layout="block" styleClass="usuario-activo">
                <h:outputText value="Usuario autenticado: " styleClass="etiqueta" />
                <h:outputText value="#{sessionScope.usuarioAutenticado}" styleClass="valor" />
            </h:panelGroup>

        </div>
    </div>

    <div class="pie">SIGH · Grupo SIGH_GR04</div>

</h:body>
</html>
